version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_dev_password
      POSTGRES_DB: whereabouts_dev
    volumes:
      - whereabouts_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d whereabouts_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"      # Crucial: Maps AMQP broker protocol directly to localhost
      - "15672:15672"    # Management UI Dashboard
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"      # REST API
      - "6334:6334"      # gRPC interface
    volumes:
      - whereabouts_qdrant:/qdrant/storage

volumes:
  whereabouts_pgdata:
  whereabouts_qdrant:
